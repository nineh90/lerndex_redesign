; Laufzeiteinstellungen fuer lerndex.de
memory_limit = 128M
post_max_size = 1M
upload_max_filesize = 1M
max_execution_time = 30

; Fehler ins Protokoll, nie in die Ausgabe: eine PHP-Warnung mitten in der
; Seite verraet Pfade und landet im schlimmsten Fall im Google-Snippet.
display_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off
date.timezone = Europe/Berlin

; Das Abbild wird bei jedem Deploy neu gebaut, Dateien aendern sich im
; laufenden Container nie – Zeitstempel muessen nicht geprueft werden.
opcache.enable = 1
opcache.memory_consumption = 32
opcache.max_accelerated_files = 2000
opcache.validate_timestamps = 0
