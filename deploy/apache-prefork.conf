# Hoechstens 20 Apache-Prozesse statt 150. Der VPS teilt seinen Speicher mit
# allen anderen Projekten (n8n, Ticketsystem, nils-digital, Adventsaktion …).
# Die Seite ist fast vollstaendig statisch – mehr Prozesse machen sie nicht
# schneller, nur den Speicher voll. Gleiches Vorgehen wie bei der Adventsaktion.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          6
    ServerLimit             20
    MaxRequestWorkers       20
    MaxConnectionsPerChild 1000
</IfModule>
